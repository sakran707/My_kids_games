<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>خريطة العراق</title>
<style>
  :root{
    --white:#fff; --gray-bg:#f5f5f7; --text:#1d1d1f; --text-2:#6e6e73;
    --blue:#0071e3; --blue-hover:#0077ed; --line:#d2d2d7;
    --green:#1f9d55; --green-bg:#e6f6ec; --red:#d93025; --red-bg:#fdeceb;
    --land:#e9eef5; --land-hover:#d6e4f5; --target:#ffd966;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Tajawal",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font);color:var(--text);display:flex;flex-direction:column;background:var(--gray-bg);-webkit-tap-highlight-color:transparent;}
  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 18px;background:var(--white);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  header h1{font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .stats{display:flex;gap:14px;font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums;}
  main{flex:1;overflow:auto;display:grid;place-items:center;padding:16px;}
  .screen{width:100%;max-width:520px;text-align:center;display:none;}
  .screen.show{display:block;animation:pop .3s ease backwards;}
  @keyframes pop{from{opacity:0;transform:translateY(8px);}}
  h2{font-size:24px;font-weight:600;margin-bottom:6px;}
  .muted{color:var(--text-2);font-size:15px;}
  .label{font-size:14px;color:var(--text-2);margin:20px 0 8px;text-align:right;}
  .picks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .pick{
    min-height:56px;border-radius:16px;border:1px solid var(--line);background:var(--white);
    font-family:var(--font);font-size:15px;font-weight:600;color:var(--text);cursor:pointer;padding:6px;
    transition:border-color .2s ease,background .2s ease,color .2s ease,transform .15s ease;
  }
  .pick small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px;}
  .pick:hover{border-color:var(--text-2);}
  .pick:active{transform:scale(.95);}
  .pick[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--white);}
  .best-line{font-size:13px;color:var(--text-2);min-height:20px;margin-top:12px;}
  .btn{
    border:none;cursor:pointer;background:var(--blue);color:#fff;font-family:var(--font);
    font-size:17px;min-height:48px;padding:0 30px;border-radius:980px;margin-top:12px;
    transition:background .2s ease,transform .15s ease;
  }
  .btn:hover{background:var(--blue-hover);}
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:var(--white);color:var(--text);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--text-2);}
  button:focus-visible{outline:3px solid var(--blue);outline-offset:3px;}

  .progress{display:flex;justify-content:space-between;font-size:14px;color:var(--text-2);margin-bottom:8px;font-variant-numeric:tabular-nums;}
  .ask{font-size:20px;font-weight:700;margin-bottom:10px;min-height:28px;}
  .ask .city{color:var(--blue);}
  .map-wrap{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:8px;margin-bottom:12px;}
  .map-wrap.shake{animation:shake .35s ease;}
  @keyframes shake{25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  svg.map{width:100%;height:auto;display:block;direction:ltr;}
  .prov{fill:var(--land);stroke:#9aa7b8;stroke-width:2.5;stroke-linejoin:round;transition:fill .2s ease;}
  .clickable .prov{cursor:pointer;}
  .clickable .prov:hover{fill:var(--land-hover);}
  .prov.target{fill:var(--target);}
  .prov.right{fill:#9fdcb5;}
  .prov.wrong{fill:#f4b3ad;}
  .prov.seen{fill:#dbe9fb;}
  .hit{fill:transparent;cursor:pointer;}
  .lbl{font-family:var(--font);font-size:46px;font-weight:700;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:9px;}
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ans{
    min-height:56px;border-radius:16px;border:1px solid var(--line);background:var(--white);
    font-family:var(--font);font-size:18px;font-weight:600;color:var(--text);cursor:pointer;
    transition:background .2s ease,border-color .2s ease,transform .15s ease;
  }
  .ans:hover{border-color:var(--text-2);}
  .ans:active{transform:scale(.96);}
  .ans.right{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .ans.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .ans:disabled{cursor:default;}
  .feedback{min-height:28px;margin-top:10px;font-size:17px;font-weight:600;}
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--red);}
  .info{font-size:15px;color:var(--text-2);min-height:22px;margin-top:4px;}
  .next{display:none;}
  .next.show{display:inline-block;}
  .stars{font-size:44px;letter-spacing:6px;margin:8px 0 4px;}
  .big{font-size:44px;font-weight:700;margin:4px 0;font-variant-numeric:tabular-nums;}
  .review{margin-top:18px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:right;}
  .review h3{font-size:15px;font-weight:600;margin-bottom:8px;}
  .review ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;}
  .review li{background:var(--gray-bg);border-radius:10px;padding:6px 12px;font-size:15px;}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .credit{font-size:11px;color:var(--text-2);margin-top:6px;}
  .hint-bar{
    flex:0 0 auto;text-align:center;font-size:12px;color:var(--text-2);
    padding:8px;background:var(--white);border-top:1px solid var(--line);
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>

    <h1>🗺️ خريطة العراق</h1>

      <p class="feedback" id="feedback" aria-live="polite"></p>

      <button class="btn ghost next" id="exitBtn" type="button">رجوع</button>
      <p class="credit">حدود المحافظات: geoBoundaries</p>
    </section>

    <section class="screen" id="endScreen">
      <h2 id="endTitle">أحسنت!</h2>
      <div class="stars" id="starsEl"></div>

      <p class="muted" id="endInfo"></p>
      <div id="newBadges" hidden></div>
      <div class="review" id="review" hidden>

        <button class="btn ghost" id="changeBtn" type="button">غيّر الطريقة</button>
      </div>
    </section>
  </main>

const MODES = {
  find:    ['وين المحافظة؟', 'اسم ← خريطة'],
  name:    ['شنو اسمها؟', 'خريطة ← اسم'],
  center:  ['وين المدينة؟', 'مراكز المحافظات'],
  explore: ['استكشف', 'بدون نقاط'],
};
const ROUND = 10, LIVES = 3;
const $ = (id) => document.getElementById(id);
const screens = { start: $('startScreen'), play: $('playScreen'), end: $('endScreen') };
const store = {
  get(k){ try { return +localStorage.getItem(k) || 0; } catch { return 0; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};
const ar = (id) => INFO[id][0], capital = (id) => INFO[id][1];
const centerText = (id) => ar(id) === capital(id) ? 'مركزها مدينة ' + capital(id) + ' أيضاً' : 'مركزها مدينة ' + capital(id);

let mode = 'find', questions = [], qi = 0, score = 0, lives = LIVES, streak = 0, correct = 0, mistakes = [], locked = false;

Object.entries(MODES).forEach(([id, [label, sub]]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'pick'; b.dataset.id = id; b.textContent = label;
  const s = document.createElement('small'); s.textContent = sub; b.appendChild(s);
  b.addEventListener('click', () => { mode = id; refresh(); });
  $('modes').appendChild(b);
});
function refresh(){
  $('modes').querySelectorAll('.pick').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === mode ? 'true' : 'false'));
  const best = store.get('map-best-' + mode);
  $('bestLine').textContent = best && mode !== 'explore' ? 'أفضل نتيجة لهذا الاختيار: ' + best : '';
  $('startBtn').textContent = mode === 'explore' ? 'افتح الخريطة' : 'ابدأ';
}
refresh();
function show(name){ Object.values(screens).forEach(s => s.classList.remove('show')); screens[name].classList.add('show'); }

let actx = null;
function beep(freq, dur){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function shuffle(arr){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

/* رسم الخريطة */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
let svg, paths = {}, labels;
function drawMap(clickable){
  svg = el('svg', { viewBox: '0 0 ' + MAP.w + ' ' + MAP.h, class: 'map' + (clickable ? ' clickable' : ''), role: 'img', 'aria-label': 'خريطة محافظات العراق' });
  paths = {};
  MAP.shapes.forEach(s => {
    const p = el('path', { d: s.d, class: 'prov', 'data-id': s.id });
    const t = el('title', {}); t.textContent = clickable && mode === 'explore' ? ar(s.id) : ''; p.appendChild(t);
    svg.appendChild(p);
    paths[s.id] = p;
  });
  if (clickable){
    MAP.shapes.filter(s => SMALL.includes(s.id)).forEach(s => svg.appendChild(el('circle', { cx: s.x, cy: s.y, r: 34, class: 'hit', 'data-id': s.id })));
  }
  labels = el('g', {});
  svg.appendChild(labels);
  svg.addEventListener('click', e => {
    const id = e.target.getAttribute && e.target.getAttribute('data-id');
    if (id) onMapClick(id);
  });
  $('mapWrap').innerHTML = '';
  $('mapWrap').appendChild(svg);
}
function label(id){
  const s = MAP.shapes.find(x => x.id === id);
  const t = el('text', { x: s.x, y: s.y, class: 'lbl' });
  t.textContent = ar(id);
  labels.appendChild(t);
}
function clearMarks(){
  Object.values(paths).forEach(p => p.classList.remove('target', 'right', 'wrong'));
  labels.innerHTML = '';
}

function startGame(){
  qi = 0; score = 0; lives = LIVES; streak = 0; correct = 0; mistakes = [];
  updateStats();
  show('play');
  $('answers').innerHTML = '';
  $('feedback').textContent = ''; $('info').textContent = '';
  if (mode === 'explore'){
    drawMap(true);
    $('qNum').textContent = 'استكشف الخريطة'; $('streakEl').textContent = '';
    $('ask').textContent = 'اضغط على أي محافظة حتى تعرف اسمها 👆';
    $('nextBtn').classList.remove('show');
    $('exitBtn').classList.add('show');
    return;
  }
  $('exitBtn').classList.remove('show');
  questions = shuffle(MAP.shapes.map(s => s.id)).slice(0, ROUND);
  drawMap(mode !== 'name');
  nextQuestion();
}
function updateStats(){
  $('scoreEl').textContent = 'النقاط: ' + score;
  $('livesEl').textContent = '❤️'.repeat(lives) + '🤍'.repeat(LIVES - lives);
  $('streakEl').textContent = streak >= 2 ? '🔥 ' + streak + ' متتالية' : '';
}

function nextQuestion(){
  if (qi >= ROUND || lives <= 0) return endGame();
  locked = false;
  const id = questions[qi];
  clearMarks();
  $('qNum').textContent = 'السؤال ' + (qi + 1) + ' من ' + ROUND;
  $('mapWrap').classList.remove('shake');
  $('feedback').textContent = ''; $('feedback').className = 'feedback';
  $('info').textContent = '';
  $('nextBtn').classList.remove('show');
  const box = $('answers'); box.innerHTML = '';
  const ask = $('ask'); ask.innerHTML = '';
  if (mode === 'find'){
    ask.textContent = 'وين محافظة ' + ar(id) + '؟';
  } else if (mode === 'center'){
    const c = document.createElement('span'); c.className = 'city'; c.textContent = capital(id);
    ask.append('بأي محافظة مدينة ', c, '؟');
  } else {
    ask.textContent = 'شنو اسم المحافظة الصفراء؟';
    paths[id].classList.add('target');
    const others = shuffle(MAP.shapes.map(s => s.id).filter(x => x !== id)).slice(0, 3);
    shuffle([id, ...others]).forEach((o, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ans'; b.textContent = ar(o); b.dataset.val = o; b.dataset.key = i + 1;
      b.addEventListener('click', () => answer(o, b));
      box.appendChild(b);
    });
  }
}

function onMapClick(id){
  if (mode === 'explore'){
    clearMarks();
    paths[id].classList.add('target');
    label(id);
    $('feedback').textContent = 'محافظة ' + ar(id); $('feedback').className = 'feedback good';
    $('info').textContent = centerText(id);
    beep(660, .08);
    return;
  }
  if (mode === 'name' || locked) return;
  answer(id, null);
}

function answer(val, btn){
  if (locked) return;
  locked = true;
  const id = questions[qi];
  const ok = val === id;
  const fb = $('feedback');
  paths[id].classList.add('right');
  label(id);
  if (mode === 'name') [...$('answers').children].forEach(x => { x.disabled = true; if (x.dataset.val === id) x.classList.add('right'); });
  if (ok){
    streak++; correct++;
    score += 10 + (streak >= 3 ? 5 : 0);
    fb.textContent = ['ممتاز! 👏', 'أحسنت! ⭐', 'رائع! 🎉', 'صحيح! ✅'][rand(0, 3)];
    fb.className = 'feedback good';
    beep(880, .15);
  } else {
    streak = 0; lives--;
    mistakes.push(id);
    if (btn) btn.classList.add('wrong');
    else { paths[val].classList.add('wrong'); label(val); }
    fb.textContent = mode === 'name' ? 'هذي محافظة ' + ar(id) : 'هذي ' + ar(val) + '، و' + ar(id) + ' باللون الأخضر';
    fb.className = 'feedback bad';
    const w = $('mapWrap'); void w.offsetWidth; w.classList.add('shake');
    beep(220, .25);
  }
  $('info').textContent = 'محافظة ' + ar(id) + ' · ' + centerText(id);
  updateStats();
  qi++;
  $('nextBtn').classList.add('show');
  $('nextBtn').focus();
}

function endGame(){
  const k = 'map-best-' + mode;
  const best = Math.max(store.get(k), score);
  store.set(k, best);
  const ratio = correct / ROUND;
  const stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : ratio > 0 ? 1 : 0;
  $('starsEl').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  if (window.Progress) Progress.celebrate($('newBadges'), Progress.record('iraqmap', { stars, correct, total: ROUND, score }));
  $('endTitle').textContent = lives <= 0 ? 'انتهت المحاولات!' : stars === 3 ? 'خبير الخريطة! 🏆' : stars === 2 ? 'أحسنت!' : 'حاول مرة أخرى 💪';
  $('finalScore').textContent = score;
  $('endInfo').textContent = 'أجبت ' + correct + ' من ' + ROUND + ' صحيحة · أفضل نتيجة: ' + best;
  $('reviewList').innerHTML = '';
  mistakes.forEach(id => { const li = document.createElement('li'); li.textContent = ar(id) + ' · مركزها ' + capital(id); $('reviewList').appendChild(li); });
  $('review').hidden = !mistakes.length;
  show('end');
  $('againBtn').focus();
}

$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('changeBtn').addEventListener('click', () => { refresh(); show('start'); });
$('exitBtn').addEventListener('click', () => { refresh(); show('start'); });
$('nextBtn').addEventListener('click', nextQuestion);
window.addEventListener('keydown', e => {
  if (!screens.play.classList.contains('show') || mode === 'explore') return;
  if (locked && (e.key === 'Enter' || e.key === ' ') && document.activeElement !== $('nextBtn')) { e.preventDefault(); $('nextBtn').click(); return; }
  if (locked || mode !== 'name') return;
  const btn = $('answers').querySelector('[data-key="' + e.key + '"]');
  if (btn) btn.click();
});
if (window.Progress) Progress.mountPlayerPicker($('playerPick'));
</script>
</body>
</html>
