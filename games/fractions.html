<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الكسور بالبيتزا</title>
<style>
  :root{
    --white:#fff; --gray-bg:#f5f5f7; --text:#1d1d1f; --text-2:#6e6e73;
    --blue:#0071e3; --blue-hover:#0077ed; --line:#d2d2d7;
    --green:#1f9d55; --green-bg:#e6f6ec; --red:#d93025; --red-bg:#fdeceb;
    --cheese:#f6c453; --crust:#d9973f; --sauce:#c8432b; --empty:#f1ece4;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Tajawal",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font);color:var(--text);display:flex;flex-direction:column;background:var(--gray-bg);-webkit-tap-highlight-color:transparent;}
  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 18px;background:var(--white);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  header h1{font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .stats{display:flex;gap:14px;font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums;}
  main{flex:1;overflow:auto;display:grid;place-items:center;padding:20px 16px;}
  .screen{width:100%;max-width:440px;text-align:center;display:none;}
  .screen.show{display:block;animation:pop .3s ease backwards;}
  @keyframes pop{from{opacity:0;transform:translateY(8px);}}

  h2{font-size:24px;font-weight:600;margin-bottom:6px;}
  .muted{color:var(--text-2);font-size:15px;}
  .label{font-size:14px;color:var(--text-2);margin:20px 0 8px;text-align:right;}
  .picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pick{
    min-height:56px;border-radius:16px;border:1px solid var(--line);background:var(--white);
    font-family:var(--font);font-size:15px;font-weight:600;color:var(--text);cursor:pointer;padding:6px;
    transition:border-color .2s ease,background .2s ease,color .2s ease,transform .15s ease;
  }
  .pick small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px;}
  .pick:hover{border-color:var(--text-2);}
  .pick:active{transform:scale(.95);}
  .pick[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--white);}
  .best-line{font-size:13px;color:var(--text-2);min-height:20px;margin-top:12px;}

  .btn{
    border:none;cursor:pointer;background:var(--blue);color:#fff;font-family:var(--font);
    font-size:17px;min-height:48px;padding:0 30px;border-radius:980px;margin-top:12px;
    transition:background .2s ease,transform .15s ease;
  }
  .btn:hover{background:var(--blue-hover);}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn.ghost{background:var(--white);color:var(--text);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--text-2);}
  button:focus-visible{outline:3px solid var(--blue);outline-offset:3px;}

  .progress{display:flex;justify-content:space-between;font-size:14px;color:var(--text-2);margin-bottom:12px;font-variant-numeric:tabular-nums;}
  .question{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:16px 10px 14px;margin-bottom:16px;}
  .question.shake{animation:shake .35s ease;}
  @keyframes shake{25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  .ask{font-size:15px;color:var(--text-2);margin-top:8px;}
  .pizza{width:min(210px,56vw);height:auto;display:block;margin:0 auto;}
  .pizza.small{width:min(140px,36vw);}
  .pizza .slice{stroke:var(--crust);stroke-width:2;}
  .pizza .slice.on{fill:var(--cheese);}
  .pizza .slice.off{fill:var(--empty);}
  .pizza.tap .slice{cursor:pointer;transition:fill .15s ease;}
  .pizza.tap .slice.off:hover{fill:#f8e2b0;}
  .pizza .rim{fill:none;stroke:var(--crust);stroke-width:8;}
  .pizza .pep{fill:var(--sauce);pointer-events:none;}

  /* الكسر بشكل عمودي */
  .frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;}
  .frac i{font-style:normal;}
  .frac hr{width:100%;min-width:1.1em;border:0;border-top:3px solid currentColor;margin:3px 0;}
  .frac.big{font-size:44px;}
  .say{font-size:16px;font-weight:600;margin-top:6px;min-height:22px;color:var(--text-2);}

  .answers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .ans{
    min-height:84px;border-radius:18px;border:1px solid var(--line);background:var(--white);
    font-family:var(--font);color:var(--text);cursor:pointer;font-size:28px;
    transition:background .2s ease,border-color .2s ease,transform .15s ease;
  }
  .ans:hover{border-color:var(--text-2);}
  .ans:active{transform:scale(.96);}
  .ans.right{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .ans.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .ans:disabled{cursor:default;}
  .ans.eq{font-size:34px;font-weight:700;}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;}
  .compare .frac{font-size:28px;margin-top:6px;}
  .answers.cmp{grid-template-columns:1fr auto 1fr;}
  .answers.cmp .eq{min-width:84px;}

  .count{font-size:15px;color:var(--text-2);margin-top:8px;font-variant-numeric:tabular-nums;}
  .feedback{min-height:28px;margin-top:14px;font-size:17px;font-weight:600;}
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--red);}
  .rule{
    display:none;margin-top:10px;background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:10px 14px;font-size:15px;color:var(--text-2);text-align:right;line-height:1.6;
  }
  .rule.show{display:block;}
  .rule b{color:var(--text);}
  .next,.check{display:none;}
  .next.show,.check.show{display:inline-block;}

  .stars{font-size:44px;letter-spacing:6px;margin:8px 0 4px;}
  .big{font-size:44px;font-weight:700;margin:4px 0;font-variant-numeric:tabular-nums;}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .hint-bar{
    flex:0 0 auto;text-align:center;font-size:12px;color:var(--text-2);
    padding:8px;background:var(--white);border-top:1px solid var(--line);
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
  <header>
    <h1>🍕 الكسور بالبيتزا</h1>
    <div class="stats">
      <span id="scoreEl">النقاط: 0</span>
      <span id="livesEl">❤️❤️❤️</span>
    </div>
  </header>

  <main>
    <section class="screen show" id="startScreen">
      <h2>نتعلّم الكسور</h2>
      <p class="muted">10 أسئلة · المقام = كل القطع · البسط = القطع الملوّنة</p>
      <div id="playerPick"></div>
      <p class="label">المستوى</p>
      <div class="picks" id="levels"></div>
      <p class="label">طريقة اللعب</p>
      <div class="picks" id="modes"></div>
      <p class="best-line" id="bestLine"></p>
      <button class="btn" id="startBtn" type="button">ابدأ</button>
    </section>

    <section class="screen" id="playScreen">
      <div class="progress"><span id="qNum">السؤال 1 من 10</span><span id="streakEl"></span></div>
      <div class="question" id="question">
        <div id="prompt"></div>
        <p class="ask" id="ask"></p>
      </div>
      <div class="answers" id="answers"></div>
      <button class="btn check" id="checkBtn" type="button">تحقّق ✓</button>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="rule" id="rule"></div>
      <button class="btn next" id="nextBtn" type="button">التالي</button>
    </section>

    <section class="screen" id="endScreen">
      <h2 id="endTitle">أحسنت!</h2>
      <div class="stars" id="starsEl"></div>
      <div class="big" id="finalScore">0</div>
      <p class="muted" id="endInfo"></p>
      <div id="newBadges" hidden></div>
      <div class="actions">
        <button class="btn" id="againBtn" type="button">العب مرة أخرى</button>
        <button class="btn ghost" id="changeBtn" type="button">غيّر المستوى</button>
      </div>
    </section>
  </main>

  <div class="hint-bar">🍕 القطع الصفراء = الملوّنة · القطع الفاتحة = الفارغة</div>

<script src="progress.js?v=4"></script>
<script>
const LEVELS = {
  easy:   { label: 'سهل', sub: '½ ⅓ ¼', dens: [2, 3, 4] },
  medium: { label: 'متوسط', sub: 'لحد الأثمان', dens: [2, 3, 4, 5, 6, 8] },
  hard:   { label: 'صعب', sub: 'لحد 12', dens: [2, 3, 4, 5, 6, 8, 10, 12] },
};
const MODES = {
  read:    ['ما الكسر؟', 'بيتزا ← كسر'],
  build:   ['لوّن الكسر', 'كسر ← بيتزا'],
  compare: ['أيهما أكبر؟', 'قارن كسرين'],
};
const ROUND = 10, LIVES = 3;
const $ = (id) => document.getElementById(id);
const screens = { start: $('startScreen'), play: $('playScreen'), end: $('endScreen') };
const store = {
  get(k){ try { return +localStorage.getItem(k) || 0; } catch { return 0; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};
let level = 'easy', mode = 'read';
let questions = [], qi = 0, score = 0, lives = LIVES, streak = 0, correct = 0, locked = false;

/* أسماء الكسور بالعربي (للمقامات من 2 إلى 10) */
const ONE = { 2: 'نصف', 3: 'ثلث', 4: 'ربع', 5: 'خمس', 6: 'سدس', 7: 'سبع', 8: 'ثمن', 9: 'تسع', 10: 'عشر' };
const TWO = { 3: 'ثلثان', 4: 'ربعان', 5: 'خمسان', 6: 'سدسان', 7: 'سبعان', 8: 'ثمنان', 9: 'تسعان', 10: 'عشران' };
const MANY = { 3: 'أثلاث', 4: 'أرباع', 5: 'أخماس', 6: 'أسداس', 7: 'أسباع', 8: 'أثمان', 9: 'أتساع', 10: 'أعشار' };
const NUM = { 3: 'ثلاثة', 4: 'أربعة', 5: 'خمسة', 6: 'ستة', 7: 'سبعة', 8: 'ثمانية', 9: 'تسعة' };
function sayFrac(n, d){
  if (n === d) return 'واحد كامل';
  if (!ONE[d]) return '';
  if (n === 1) return ONE[d];
  if (n === 2) return TWO[d] || '';
  return NUM[n] ? NUM[n] + ' ' + MANY[d] : '';
}

function makePicks(el, items, setCur){
  items.forEach(([id, label, sub]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pick'; b.dataset.id = id; b.textContent = label;
    if (sub){ const s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
    b.addEventListener('click', () => { setCur(id); refresh(); });
    el.appendChild(b);
  });
}
makePicks($('levels'), Object.entries(LEVELS).map(([id, l]) => [id, l.label, l.sub]), v => level = v);
makePicks($('modes'), Object.entries(MODES).map(([id, m]) => [id, m[0], m[1]]), v => mode = v);
function refresh(){
  $('levels').querySelectorAll('.pick').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === level ? 'true' : 'false'));
  $('modes').querySelectorAll('.pick').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === mode ? 'true' : 'false'));
  const best = store.get('frac-best-' + level + '-' + mode);
  $('bestLine').textContent = best ? 'أفضل نتيجة لهذا الاختيار: ' + best : '';
}
refresh();
function show(name){ Object.values(screens).forEach(s => s.classList.remove('show')); screens[name].classList.add('show'); }

let actx = null;
function beep(freq, dur){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pickOne = (arr) => arr[rand(0, arr.length - 1)];
function shuffle(arr){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

/* رسم البيتزا */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function pizza(d, on, opts = {}){
  const s = el('svg', { viewBox: '0 0 200 200', class: 'pizza' + (opts.small ? ' small' : '') + (opts.tap ? ' tap' : ''), role: 'img', 'aria-label': 'بيتزا مقسومة إلى ' + d + ' قطع' });
  const R = 92, cx = 100, cy = 100;
  for (let i = 0; i < d; i++){
    const a0 = -Math.PI / 2 + i * 2 * Math.PI / d, a1 = a0 + 2 * Math.PI / d;
    const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0), x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    const path = d === 1 ? `M ${cx - R} ${cy} A ${R} ${R} 0 1 1 ${cx + R} ${cy} A ${R} ${R} 0 1 1 ${cx - R} ${cy} Z`
      : `M ${cx} ${cy} L ${x0} ${y0} A ${R} ${R} 0 ${(a1 - a0) > Math.PI ? 1 : 0} 1 ${x1} ${y1} Z`;
    const p = el('path', { d: path, class: 'slice ' + (on.has(i) ? 'on' : 'off'), 'data-i': i });
    s.appendChild(p);
    /* حبتين ببروني على القطع الملوّنة */
    if (on.has(i)){
      [[.55, .35], [.6, .7]].forEach(([rf, af]) => {
        const a = a0 + (a1 - a0) * af, r = R * rf;
        s.appendChild(el('circle', { cx: cx + r * Math.cos(a), cy: cy + r * Math.sin(a), r: Math.max(4, 11 - d * .5), class: 'pep' }));
      });
    }
  }
  s.appendChild(el('circle', { cx, cy, r: R + 2, class: 'rim' }));
  return s;
}
function fracEl(n, d, big){
  const f = document.createElement('span');
  f.className = 'frac' + (big ? ' big' : '');
  const a = document.createElement('i'); a.textContent = n;
  const b = document.createElement('i'); b.textContent = d;
  f.append(a, document.createElement('hr'), b);
  f.setAttribute('aria-label', n + ' من ' + d);
  return f;
}
const val = (f) => f.n / f.d;
const fkey = (f) => f.n + '/' + f.d;

function randFrac(){
  const d = pickOne(LEVELS[level].dens);
  return { n: rand(1, d - 1), d };
}
function buildQuestions(){
  const list = [], seen = new Set();
  let guard = 0;
  while (list.length < ROUND && guard++ < 500){
    let q;
    if (mode === 'compare'){
      const kind = level === 'easy' ? pickOne(['sameD', 'sameD', 'sameN']) : pickOne(['sameD', 'sameN', 'diff', 'equal']);
      let a, b;
      if (kind === 'sameD'){ a = randFrac(); b = { n: rand(1, a.d - 1), d: a.d }; if (a.n === b.n) continue; }
      else if (kind === 'sameN'){ const ds = LEVELS[level].dens; const d1 = pickOne(ds), d2 = pickOne(ds.filter(x => x !== d1)); const n = rand(1, Math.min(d1, d2) - 1); a = { n, d: d1 }; b = { n, d: d2 }; }
      else if (kind === 'equal'){ const base = pickOne([[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5]]); const k = pickOne([2, 3, 4].filter(m => LEVELS[level].dens.includes(base[1] * m))); if (!k) continue; a = { n: base[0], d: base[1] }; b = { n: base[0] * k, d: base[1] * k }; if (Math.random() < .5) [a, b] = [b, a]; }
      else { a = randFrac(); b = randFrac(); if (a.d === b.d || a.n === b.n || val(a) === val(b)) continue; }
      q = { a, b, kind };
      const k = fkey(a) + '|' + fkey(b);
      if (seen.has(k)) continue; seen.add(k);
    } else {
      q = randFrac();
      if (seen.has(fkey(q)) && seen.size < 6) continue; seen.add(fkey(q));
    }
    list.push(q);
  }
  return list;
}

/* أخطاء شائعة: عدّ القطع الفارغة، تغيير المقام، زيادة/نقص قطعة */
function distractors(q){
  const c = [
    { n: q.d - q.n, d: q.d },
    { n: q.n, d: q.d + 1 }, { n: q.n, d: q.d - 1 },
    { n: q.n + 1, d: q.d }, { n: q.n - 1, d: q.d },
    { n: q.d - q.n, d: q.n + (q.d - q.n) + 1 },
  ];
  const out = [], seen = new Set([fkey(q)]);
  for (const f of c){
    if (out.length >= 3) break;
    if (f.n < 1 || f.d < 2 || f.n > f.d || seen.has(fkey(f))) continue;
    seen.add(fkey(f)); out.push(f);
  }
  while (out.length < 3){ const d = q.d + rand(-1, 2); const f = { n: rand(1, Math.max(1, d - 1)), d: Math.max(2, d) }; if (!seen.has(fkey(f))){ seen.add(fkey(f)); out.push(f); } }
  return shuffle([q, ...out]);
}

function startGame(){
  questions = buildQuestions();
  qi = 0; score = 0; lives = LIVES; streak = 0; correct = 0;
  updateStats(); show('play'); nextQuestion();
}
function updateStats(){
  $('scoreEl').textContent = 'النقاط: ' + score;
  $('livesEl').textContent = '❤️'.repeat(lives) + '🤍'.repeat(LIVES - lives);
  $('streakEl').textContent = streak >= 2 ? '🔥 ' + streak + ' متتالية' : '';
}

let built = new Set();
function nextQuestion(){
  if (qi >= questions.length || lives <= 0) return endGame();
  locked = false;
  const q = questions[qi];
  $('qNum').textContent = 'السؤال ' + (qi + 1) + ' من ' + questions.length;
  $('question').classList.remove('shake');
  $('feedback').textContent = ''; $('feedback').className = 'feedback';
  $('rule').className = 'rule';
  $('nextBtn').classList.remove('show');
  $('checkBtn').classList.remove('show');
  const prompt = $('prompt'); prompt.innerHTML = '';
  const box = $('answers'); box.innerHTML = ''; box.className = 'answers';

  if (mode === 'read'){
    const on = new Set(shuffle([...Array(q.d).keys()]).slice(0, q.n));
    /* القطع الملوّنة متجاورة حتى تكون أوضح للصغار */
    const start = rand(0, q.d - 1);
    on.clear(); for (let i = 0; i < q.n; i++) on.add((start + i) % q.d);
    prompt.appendChild(pizza(q.d, on));
    $('ask').textContent = 'كم من البيتزا ملوّن؟';
    distractors(q).forEach((f, i) => addAnswer(fracEl(f.n, f.d), fkey(f), fkey(q), i));
  } else if (mode === 'build'){
    built = new Set();
    prompt.appendChild(fracEl(q.n, q.d, true));
    const s = document.createElement('div'); s.className = 'say'; s.textContent = sayFrac(q.n, q.d); prompt.appendChild(s);
    const p = pizza(q.d, built, { tap: true });
    p.addEventListener('click', e => {
      const i = e.target.getAttribute && e.target.getAttribute('data-i');
      if (i === null || locked) return;
      const k = +i; built.has(k) ? built.delete(k) : built.add(k);
      e.target.classList.toggle('on', built.has(k)); e.target.classList.toggle('off', !built.has(k));
      beep(built.has(k) ? 660 : 440, .05);
      $('count').textContent = 'لوّنت ' + built.size + ' من ' + q.d;
    });
    prompt.appendChild(p);
    const c = document.createElement('div'); c.className = 'count'; c.id = 'count'; c.textContent = 'لوّنت 0 من ' + q.d; prompt.appendChild(c);
    $('ask').textContent = 'اضغط على القطع حتى تلوّنها';
    $('checkBtn').classList.add('show');
  } else {
    const wrap = document.createElement('div'); wrap.className = 'compare';
    [q.a, q.b].forEach(f => {
      const col = document.createElement('div');
      const on = new Set([...Array(f.n).keys()]);
      col.append(pizza(f.d, on, { small: true }), fracEl(f.n, f.d));
      wrap.appendChild(col);
    });
    prompt.appendChild(wrap);
    $('ask').textContent = 'أي كسر أكبر؟ أو متساويان؟';
    box.className = 'answers cmp';
    const right = val(q.a) > val(q.b) ? 'a' : val(q.a) < val(q.b) ? 'b' : 'eq';
    addAnswer(fracEl(q.a.n, q.a.d), 'a', right, 0);
    const eq = document.createElement('span'); eq.textContent = '='; addAnswer(eq, 'eq', right, 1, 'eq');
    addAnswer(fracEl(q.b.n, q.b.d), 'b', right, 2);
  }
}
function addAnswer(content, v, right, i, extra){
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'ans' + (extra ? ' ' + extra : '');
  btn.dataset.val = v; btn.dataset.key = i + 1;
  btn.appendChild(content);
  btn.addEventListener('click', () => answer(v === right, btn, right));
  $('answers').appendChild(btn);
}

function hintFor(q){
  if (mode === 'read') return '<b>المقام</b> (الرقم تحت) = عدد كل القطع، و<b>البسط</b> (الرقم فوق) = عدد القطع الملوّنة.';
  if (mode === 'build') return 'لوّن عدد قطع يساوي <b>البسط</b> (الرقم فوق).';
  if (q.kind === 'sameD') return 'إذا <b>المقامات متساوية</b>، الكسر الأكبر هو صاحب البسط الأكبر.';
  if (q.kind === 'sameN') return 'إذا <b>البسط متساوي</b>، الكسر الأكبر هو صاحب المقام الأصغر، لأن قطعه أكبر.';
  if (q.kind === 'equal') return 'الكسران <b>متساويان</b>: نفس كمية البيتزا، بس مقسومة لقطع أكثر.';
  return 'قارن الرسمتين: <b>أي بيتزا ملوّنة أكثر؟</b>';
}

function answer(ok, btn, right){
  if (locked) return;
  locked = true;
  const q = questions[qi];
  [...$('answers').children].forEach(x => { x.disabled = true; if (x.dataset.val === right) x.classList.add('right'); });
  finish(ok, btn);
}
$('checkBtn').addEventListener('click', () => {
  if (locked) return;
  locked = true;
  $('checkBtn').classList.remove('show');
  finish(built.size === questions[qi].n, null);
});

function finish(ok, btn){
  const q = questions[qi];
  const fb = $('feedback');
  if (ok){
    streak++; correct++;
    score += 10 + (streak >= 3 ? 5 : 0);
    fb.textContent = ['ممتاز! 👏', 'أحسنت! ⭐', 'رائع! 🎉', 'صحيح! ✅'][rand(0, 3)];
    if (mode !== 'compare' && sayFrac(q.n, q.d)) fb.textContent += ' ' + sayFrac(q.n, q.d);
    fb.className = 'feedback good';
    beep(880, .15);
  } else {
    if (btn) btn.classList.add('wrong');
    streak = 0; lives--;
    if (mode === 'read') fb.textContent = 'الجواب: ⁦' + q.n + '/' + q.d + '⁩' + (sayFrac(q.n, q.d) ? ' · ' + sayFrac(q.n, q.d) : '');
    else if (mode === 'build') fb.textContent = 'لازم تلوّن ' + q.n + ' قطع، ولوّنت ' + built.size;
    else fb.textContent = 'حاول تقارن مرة ثانية';
    fb.className = 'feedback bad';
    const el2 = $('question'); void el2.offsetWidth; el2.classList.add('shake');
    beep(220, .25);
    $('rule').innerHTML = '💡 ' + hintFor(q);
    $('rule').className = 'rule show';
  }
  updateStats();
  qi++;
  $('nextBtn').classList.add('show');
  $('nextBtn').focus();
}

function endGame(){
  const total = questions.length;
  const k = 'frac-best-' + level + '-' + mode;
  const best = Math.max(store.get(k), score);
  store.set(k, best);
  const ratio = correct / total;
  const stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : ratio > 0 ? 1 : 0;
  $('starsEl').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  if (window.Progress) Progress.celebrate($('newBadges'), Progress.record('fractions', { stars, correct, total, score }));
  $('endTitle').textContent = lives <= 0 ? 'انتهت المحاولات!' : stars === 3 ? 'ملك الكسور! 🏆' : stars === 2 ? 'أحسنت!' : 'حاول مرة أخرى 💪';
  $('finalScore').textContent = score;
  $('endInfo').textContent = 'أجبت ' + correct + ' من ' + total + ' صحيحة · أفضل نتيجة: ' + best;
  show('end');
  $('againBtn').focus();
}

$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('changeBtn').addEventListener('click', () => { refresh(); show('start'); });
$('nextBtn').addEventListener('click', nextQuestion);
window.addEventListener('keydown', e => {
  if (!screens.play.classList.contains('show')) return;
  if (locked && (e.key === 'Enter' || e.key === ' ') && document.activeElement !== $('nextBtn')) { e.preventDefault(); $('nextBtn').click(); return; }
  if (locked) return;
  const btn = $('answers').querySelector('[data-key="' + e.key + '"]');
  if (btn) btn.click();
});
if (window.Progress) Progress.mountPlayerPicker($('playerPick'));
</script>
</body>
