<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الإملاء العربي</title>
<style>
  :root{
    --white:#fff; --gray-bg:#f5f5f7; --text:#1d1d1f; --text-2:#6e6e73;
    --blue:#0071e3; --blue-hover:#0077ed; --line:#d2d2d7;
    --green:#1f9d55; --green-bg:#e6f6ec; --red:#d93025; --red-bg:#fdeceb;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Tajawal",Arial,sans-serif;
    --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font);color:var(--text);display:flex;flex-direction:column;background:var(--gray-bg);-webkit-tap-highlight-color:transparent;}
  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 18px;background:var(--white);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  header h1{font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .stats{display:flex;gap:14px;font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums;}
  main{flex:1;overflow:auto;display:grid;place-items:center;padding:20px 16px;}
  .screen{width:100%;max-width:440px;text-align:center;display:none;}
  .screen.show{display:block;animation:pop .3s ease backwards;}
  @keyframes pop{from{opacity:0;transform:translateY(8px);}}

  h2{font-size:24px;font-weight:600;margin-bottom:6px;}
  .muted{color:var(--text-2);font-size:15px;}
  .label{font-size:14px;color:var(--text-2);margin:20px 0 8px;text-align:right;}

  .picks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .pick{
    min-height:56px;border-radius:16px;border:1px solid var(--line);background:var(--white);
    font-family:var(--font);font-size:16px;font-weight:600;color:var(--text);cursor:pointer;padding:6px 10px;
    transition:border-color .2s ease,background .2s ease,color .2s ease,transform .15s ease;
  }
  .pick:hover{border-color:var(--text-2);}
  .pick:active{transform:scale(.95);}
  .pick[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--white);}
  .pick.wide{grid-column:1 / -1;}
  .best-line{font-size:13px;color:var(--text-2);min-height:20px;margin-top:12px;}

  .btn{
    border:none;cursor:pointer;background:var(--blue);color:#fff;font-family:var(--font);
    font-size:17px;min-height:48px;padding:0 30px;border-radius:980px;margin-top:12px;
    transition:background .2s ease,transform .15s ease;
  }
  .btn:hover{background:var(--blue-hover);}
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:var(--white);color:var(--text);border:1px solid var(--line);}
  .btn.ghost:hover{border-color:var(--text-2);}
  button:focus-visible{outline:3px solid var(--blue);outline-offset:3px;}

  .progress{display:flex;justify-content:space-between;font-size:14px;color:var(--text-2);margin-bottom:12px;font-variant-numeric:tabular-nums;}
  .question{
    position:relative;background:var(--white);border:1px solid var(--line);border-radius:22px;
    padding:22px 10px 18px;margin-bottom:18px;
  }
  .question.shake{animation:shake .35s ease;}
  @keyframes shake{25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  .pic{font-family:var(--emoji);font-size:clamp(72px,24vw,104px);line-height:1.1;}
  .word{font-size:clamp(34px,10vw,44px);font-weight:700;margin-top:8px;min-height:52px;}
  .word .gap{color:var(--blue);}
  .ask{font-size:15px;color:var(--text-2);margin-top:6px;}
  .speak{
    position:absolute;top:10px;left:10px;width:44px;height:44px;border-radius:50%;
    border:1px solid var(--line);background:var(--gray-bg);font-size:20px;cursor:pointer;
    transition:background .2s ease,transform .15s ease;
  }
  .speak:hover{background:#e8e8ed;}
  .speak:active{transform:scale(.92);}
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .answers.three{grid-template-columns:repeat(3,1fr);}
  .ans{
    min-height:68px;border-radius:18px;border:1px solid var(--line);background:var(--white);
    font-family:var(--font);font-size:26px;font-weight:600;color:var(--text);cursor:pointer;
    transition:background .2s ease,border-color .2s ease,transform .15s ease;
  }
  .ans.letter{font-size:36px;}
  .ans:hover{border-color:var(--text-2);}
  .ans:active{transform:scale(.96);}
  .ans.right{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .ans.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .ans:disabled{cursor:default;}
  .feedback{min-height:28px;margin-top:14px;font-size:17px;font-weight:600;}
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--red);}
  .rule{
    display:none;margin-top:10px;background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:10px 14px;font-size:15px;color:var(--text-2);text-align:right;line-height:1.6;
  }
  .rule.show{display:block;}
  .rule b{color:var(--text);}
  .next{display:none;}
  .next.show{display:inline-block;}

  .stars{font-size:44px;letter-spacing:6px;margin:8px 0 4px;}
  .big{font-size:44px;font-weight:700;margin:4px 0;font-variant-numeric:tabular-nums;}
  .review{
    margin-top:18px;background:var(--white);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;text-align:right;
  }
  .review h3{font-size:15px;font-weight:600;margin-bottom:8px;}
  .review ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;}
  .review li{display:flex;align-items:center;gap:8px;background:var(--gray-bg);border-radius:10px;padding:6px 12px;font-size:20px;font-weight:600;}
  .review li .e{font-family:var(--emoji);font-size:20px;}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  .hint-bar{
    flex:0 0 auto;text-align:center;font-size:12px;color:var(--text-2);
    padding:8px;background:var(--white);border-top:1px solid var(--line);
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
  <header>
    <h1>✍️ الإملاء العربي</h1>
    <div class="stats">
      <span id="scoreEl">النقاط: 0</span>
      <span id="livesEl">❤️❤️❤️</span>
    </div>
  </header>

  <main>
    <section class="screen show" id="startScreen">
      <h2>اكتب صح!</h2>
      <p class="muted">10 أسئلة · بعد كل جواب تظهر القاعدة</p>
      <div id="playerPick"></div>
      <p class="label">الدرس</p>
      <div class="picks" id="topics"></div>
      <p class="label">طريقة اللعب</p>
      <div class="picks" id="modes"></div>
      <p class="best-line" id="bestLine"></p>
      <button class="btn" id="startBtn" type="button">ابدأ</button>
    </section>

    <section class="screen" id="playScreen">
      <div class="progress"><span id="qNum">السؤال 1 من 10</span><span id="streakEl"></span></div>
      <div class="question" id="question">
        <button class="speak" id="speakBtn" type="button" aria-label="استمع للكلمة" title="استمع للكلمة" hidden>🔊</button>
        <div class="pic" id="pic" aria-hidden="true"></div>
        <div class="word" id="word"></div>
        <p class="ask" id="ask"></p>
      </div>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="rule" id="rule"></div>
      <button class="btn next" id="nextBtn" type="button">التالي</button>
    </section>

    <section class="screen" id="endScreen">
      <h2 id="endTitle">أحسنت!</h2>
      <div class="stars" id="starsEl"></div>
      <div class="big" id="finalScore">0</div>
      <p class="muted" id="endInfo"></p>
      <div class="review" id="review" hidden>
        <h3>تدرّب على كتابة هذه الكلمات:</h3>
        <ul id="reviewList"></ul>
      </div>
      <div id="newBadges" hidden></div>
      <div class="actions">
        <button class="btn" id="againBtn" type="button">العب مرة أخرى</button>
        <button class="btn ghost" id="changeBtn" type="button">غيّر الدرس</button>
      </div>
    </section>
  </main>

  <div class="hint-bar">اختر الكتابة الصحيحة · يمكنك استخدام الأرقام 1 إلى 4 من لوحة المفاتيح</div>

<script src="progress.js"></script>
<script>
/* الدروس: الحروف المقصودة + القاعدة + الكلمات [الكلمة, الرمز, قاعدة خاصة اختيارية] */
const TOPICS = {
  taa: {
    label: 'ة / ت التاء',
    chars: 'ةت', finalOnly: true,
    rule: '<b>التاء المربوطة (ة)</b> ننطقها هاءً إذا وقفنا عليها، وتاءً إذا وصلنا الكلام.',
    words: [
      ['مدرسة','🏫'],['شجرة','🌳'],['سيارة','🚗'],['تفاحة','🍎'],['بقرة','🐄'],['سمكة','🐟'],
      ['ساعة','⌚'],['وردة','🌸'],['كرة','⚽'],['مسطرة','📏'],['نحلة','🐝'],['دجاجة','🐔'],
      ['قطة','🐱'],['موزة','🍌'],['بيضة','🥚'],['نجمة','⭐'],['حقيبة','🎒'],['ورقة','📄'],
      ['بيت','🏠','<b>التاء المفتوحة (ت)</b> ننطقها تاءً دائماً، سواء وقفنا عليها أو وصلنا الكلام.'],
      ['بنت','👧','<b>التاء المفتوحة (ت)</b> ننطقها تاءً دائماً، سواء وقفنا عليها أو وصلنا الكلام.'],
      ['وقت','⏰','<b>التاء المفتوحة (ت)</b> ننطقها تاءً دائماً، سواء وقفنا عليها أو وصلنا الكلام.'],
      ['صوت','🔊','<b>التاء المفتوحة (ت)</b> ننطقها تاءً دائماً، سواء وقفنا عليها أو وصلنا الكلام.'],
    ]
  },
  hamza: {
    label: 'ء الهمزة',
    chars: 'أإؤئء',
    rule: '<b>الهمزة في أول الكلمة</b> تُكتب فوق الألف (أ) إذا كانت مفتوحة أو مضمومة، وتحتها (إ) إذا كانت مكسورة.',
    words: [
      ['أسد','🦁'],['أرنب','🐰'],['أم','👩'],['أب','👨'],['أنف','👃'],['أسنان','🦷'],
      ['إبرة','🪡'],
      ['كأس','🏆','<b>الهمزة الساكنة في وسط الكلمة</b> تُكتب على حرف يناسب حركة ما قبلها: بعد الفتحة على الألف (أ).'],
      ['فأس','🪓','<b>الهمزة الساكنة في وسط الكلمة</b> تُكتب على حرف يناسب حركة ما قبلها: بعد الفتحة على الألف (أ).'],
      ['ذئب','🐺','<b>الهمزة الساكنة في وسط الكلمة</b> تُكتب على حرف يناسب حركة ما قبلها: بعد الكسرة على النبرة (ئ).'],
      ['سؤال','❓','<b>الهمزة في وسط الكلمة</b> تُكتب على حرف يناسب أقوى الحركتين: الكسرة (ئ) ثم الضمة (ؤ) ثم الفتحة (أ).'],
      ['طائرة','✈️','<b>الهمزة المكسورة في وسط الكلمة</b> تُكتب على النبرة (ئ) لأن الكسرة أقوى الحركات.'],
      ['ماء','💧','<b>الهمزة في آخر الكلمة</b> تُكتب على السطر (ء) إذا كان الحرف الذي قبلها ساكناً.'],
      ['سماء','🌌','<b>الهمزة في آخر الكلمة</b> تُكتب على السطر (ء) إذا كان الحرف الذي قبلها ساكناً.'],
      ['دواء','💊','<b>الهمزة في آخر الكلمة</b> تُكتب على السطر (ء) إذا كان الحرف الذي قبلها ساكناً.'],
      ['شتاء','❄️','<b>الهمزة في آخر الكلمة</b> تُكتب على السطر (ء) إذا كان الحرف الذي قبلها ساكناً.'],
      ['ضوء','💡','<b>الهمزة في آخر الكلمة</b> تُكتب على السطر (ء) إذا كان الحرف الذي قبلها ساكناً.'],
    ]
  },
  alif: {
    label: 'ى / ا آخر الكلمة',
    chars: 'ىا', finalOnly: true,
    rule: '<b>الألف المقصورة (ى)</b> تأتي في آخر الكلمة، وتُكتب مثل الياء لكن بلا نقطتين.',
    words: [
      ['مستشفى','🏥'],['حلوى','🍬'],['مقهى','☕'],['مبنى','🏢'],
      ['عصا','🦯','<b>الألف القائمة (ا)</b> في «عصا» لأن أصلها واو: نقول في المثنى «عصوان».'],
    ]
  },
  dad: {
    label: 'ض / ظ / ذ',
    chars: 'ضظذ',
    rule: '<b>انتبه للفرق</b> بين الضاد (ض) والظاء (ظ) والذال (ذ): انطق الكلمة جيداً قبل أن تكتبها.',
    words: [
      ['ضفدع','🐸'],['ظرف','✉️'],['ذهب','🥇'],['نظارة','👓'],['ذرة','🌽'],['ضابط','👮'],['بيضة','🥚'],
    ]
  },
};

/* الأخطاء الشائعة لكل حرف */
const CONFUSE = {
  'ة': ['ه','ت'], 'ت': ['ة','ه'],
  'ى': ['ي','ا'], 'ا': ['ى','ه'],
  'أ': ['ا','إ','ء'], 'إ': ['ا','أ'],
  'ؤ': ['ئ','ء','و'], 'ئ': ['ؤ','ء','ي'], 'ء': ['أ','ئ','ؤ'],
  'ض': ['ظ','د'], 'ظ': ['ض','ز'], 'ذ': ['ز','ظ','د'],
};
const FINAL_ONLY = 'ةتىا'; // نبدّل هذه الحروف في آخر الكلمة فقط

const MODES = { pick: 'اختر الكتابة الصحيحة', letter: 'أكمل الحرف الناقص' };

const ROUND = 10, LIVES = 3;
const $ = (id) => document.getElementById(id);
const screens = { start: $('startScreen'), play: $('playScreen'), end: $('endScreen') };
const store = {
  get(k){ try { return +localStorage.getItem(k) || 0; } catch { return 0; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};

let topic = 'all', mode = 'pick';
let questions = [], qi = 0, score = 0, lives = LIVES, streak = 0, correct = 0, mistakes = [], locked = false;

function makePicks(el, items, setCur){
  items.forEach(([id, label, wide]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick' + (wide ? ' wide' : '');
    b.textContent = label;
    b.dataset.id = id;
    b.addEventListener('click', () => { setCur(id); refresh(); });
    el.appendChild(b);
  });
}
makePicks($('topics'), [...Object.entries(TOPICS).map(([id, t]) => [id, t.label]), ['all', '🌈 كل الدروس', true]], (v) => topic = v);
makePicks($('modes'), Object.entries(MODES), (v) => mode = v);
function refresh(){
  $('topics').querySelectorAll('.pick').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === topic ? 'true' : 'false'));
  $('modes').querySelectorAll('.pick').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === mode ? 'true' : 'false'));
  const best = store.get('ar-best-' + topic + '-' + mode);
  $('bestLine').textContent = best ? 'أفضل نتيجة لهذا الاختيار: ' + best : '';
}
refresh();

function show(name){
  Object.values(screens).forEach(s => s.classList.remove('show'));
  screens[name].classList.add('show');
}

/* النطق العربي (إذا كان الجهاز يدعمه) */
let arVoice = null;
function findVoice(){
  try { arVoice = speechSynthesis.getVoices().find(v => /^ar/i.test(v.lang)) || null; } catch {}
}
if ('speechSynthesis' in window){ findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
function say(text){
  if (!arVoice) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = arVoice; u.lang = arVoice.lang; u.rate = .8; speechSynthesis.speak(u); } catch {}
}
let actx = null;
function beep(freq, dur){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}

const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function shuffle(arr){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

/* المواضع اللي نگدر نغيّرها بالكلمة حسب الدرس */
function spots(word, t){
  const out = [];
  [...word].forEach((ch, i) => {
    if (!CONFUSE[ch] || !TOPICS[t].chars.includes(ch)) return;
    if (FINAL_ONLY.includes(ch) && i !== word.length - 1) return;
    out.push(i);
  });
  return out;
}

function buildQuestions(){
  const ids = topic === 'all' ? Object.keys(TOPICS) : [topic];
  const pool = ids.flatMap(id => TOPICS[id].words.map(w => ({ word: w[0], emoji: w[1], rule: w[2] || TOPICS[id].rule, topic: id })))
                  .filter(q => spots(q.word, q.topic).length);
  return shuffle(pool).slice(0, ROUND);
}

function wrongSpellings(q){
  const out = new Set();
  const arr = [...q.word];
  for (const i of shuffle(spots(q.word, q.topic))){
    for (const c of shuffle(CONFUSE[arr[i]].slice())){
      const w = arr.slice(); w[i] = c; out.add(w.join(''));
    }
  }
  // إذا ما كفّت، نضيف أخطاء من حروف ثانية بالكلمة
  if (out.size < 3){
    arr.forEach((ch, i) => {
      if (!CONFUSE[ch] || (FINAL_ONLY.includes(ch) && i !== arr.length - 1)) return;
      CONFUSE[ch].forEach(c => { const w = arr.slice(); w[i] = c; out.add(w.join('')); });
    });
  }
  out.delete(q.word);
  return shuffle([...out]).slice(0, 3);
}

function startGame(){
  questions = buildQuestions();
  qi = 0; score = 0; lives = LIVES; streak = 0; correct = 0; mistakes = [];
  updateStats();
  show('play');
  nextQuestion();
}

function updateStats(){
  $('scoreEl').textContent = 'النقاط: ' + score;
  $('livesEl').textContent = '❤️'.repeat(lives) + '🤍'.repeat(LIVES - lives);
  $('streakEl').textContent = streak >= 2 ? '🔥 ' + streak + ' متتالية' : '';
}

function nextQuestion(){
  if (qi >= questions.length || lives <= 0) return endGame();
  locked = false;
  const q = questions[qi];
  $('qNum').textContent = 'السؤال ' + (qi + 1) + ' من ' + questions.length;
  $('question').classList.remove('shake');
  $('feedback').textContent = ''; $('feedback').className = 'feedback';
  $('rule').className = 'rule';
  $('nextBtn').classList.remove('show');
  $('pic').textContent = q.emoji;
  $('speakBtn').hidden = true;
  const box = $('answers');
  box.innerHTML = '';
  let opts;

  if (mode === 'pick'){
    $('word').textContent = '';
    $('ask').textContent = 'أي كتابة صحيحة؟';
    opts = shuffle([q.word, ...wrongSpellings(q)]);
    q.correctVal = q.word;
    box.className = 'answers' + (opts.length === 3 ? ' three' : '');
  } else {
    const sp = spots(q.word, q.topic);
    const idx = sp[rand(0, sp.length - 1)];
    const ch = q.word[idx];
    $('word').innerHTML = '';
    const pre = document.createElement('span'); pre.textContent = q.word.slice(0, idx);
    const gap = document.createElement('span'); gap.className = 'gap'; gap.textContent = '؟';
    const post = document.createElement('span'); post.textContent = q.word.slice(idx + 1);
    $('word').append(pre, gap, post);
    $('ask').textContent = 'ما الحرف الناقص؟';
    opts = shuffle([ch, ...CONFUSE[ch].slice(0, 3)]);
    q.correctVal = ch;
    box.className = 'answers' + (opts.length === 3 ? ' three' : '');
  }

  opts.forEach((o, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ans' + (mode === 'letter' ? ' letter' : '');
    btn.textContent = o;
    btn.dataset.val = o;
    btn.dataset.key = i + 1;
    btn.addEventListener('click', () => answer(o, btn));
    box.appendChild(btn);
  });
}

function answer(val, btn){
  if (locked) return;
  locked = true;
  const q = questions[qi];
  const fb = $('feedback');
  [...$('answers').children].forEach(x => { x.disabled = true; if (x.dataset.val === q.correctVal) x.classList.add('right'); });
  $('word').textContent = q.word;

  if (val === q.correctVal){
    streak++; correct++;
    score += 10 + (streak >= 3 ? 5 : 0);
    fb.textContent = ['ممتاز! 👏', 'أحسنت! ⭐', 'رائع! 🎉', 'صحيح! ✅'][rand(0, 3)];
    fb.className = 'feedback good';
    beep(880, .15);
  } else {
    btn.classList.add('wrong');
    streak = 0; lives--;
    mistakes.push(q);
    fb.textContent = 'الكتابة الصحيحة: ' + q.word;
    fb.className = 'feedback bad';
    const el = $('question'); void el.offsetWidth; el.classList.add('shake');
    beep(220, .25);
  }
  $('rule').innerHTML = '💡 ' + q.rule;
  $('rule').className = 'rule show';
  $('speakBtn').hidden = !arVoice;
  say(q.word);
  updateStats();
  qi++;
  $('nextBtn').classList.add('show');
  $('nextBtn').focus();
}

function endGame(){
  const key = 'ar-best-' + topic + '-' + mode;
  const best = Math.max(store.get(key), score);
  store.set(key, best);
  const total = questions.length;
  const ratio = correct / total;
  const stars = ratio >= .9 ? 3 : ratio >= .6 ? 2 : ratio > 0 ? 1 : 0;
  $('starsEl').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
  if (window.Progress) Progress.celebrate($('newBadges'), Progress.record('arabic', { stars, correct, total: total, score }));
  $('endTitle').textContent = lives <= 0 ? 'انتهت المحاولات!' : stars === 3 ? 'بطل الإملاء! 🏆' : stars === 2 ? 'أحسنت!' : 'حاول مرة أخرى 💪';
  $('finalScore').textContent = score;
  $('endInfo').textContent = 'أجبت ' + correct + ' من ' + total + ' صحيحة · أفضل نتيجة: ' + best;
  const list = $('reviewList');
  list.innerHTML = '';
  mistakes.forEach(q => {
    const li = document.createElement('li');
    const e = document.createElement('span'); e.className = 'e'; e.textContent = q.emoji;
    const w = document.createElement('span'); w.textContent = q.word;
    li.append(e, w);
    list.appendChild(li);
  });
  $('review').hidden = mistakes.length === 0;
  show('end');
  $('againBtn').focus();
}

$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('changeBtn').addEventListener('click', () => { refresh(); show('start'); });
$('nextBtn').addEventListener('click', nextQuestion);
$('speakBtn').addEventListener('click', () => { const q = questions[qi - (locked ? 1 : 0)]; if (q) say(q.word); });
window.addEventListener('keydown', e => {
  if (!screens.play.classList.contains('show')) return;
  if (locked && (e.key === 'Enter' || e.key === ' ') && document.activeElement !== $('nextBtn')) { e.preventDefault(); $('nextBtn').click(); return; }
  if (locked) return;
  const btn = $('answers').querySelector('[data-key="' + e.key + '"]');
  if (btn) btn.click();
});
if (window.Progress) Progress.mountPlayerPicker($('playerPick'));
</script>
</body>
</html>
