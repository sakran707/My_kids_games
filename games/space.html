<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>مغامرة الفضاء</title>
<style>
  :root{
    --white:#fff; --gray-bg:#f5f5f7; --text:#1d1d1f; --text-2:#6e6e73;
    --blue:#0071e3; --blue-hover:#0077ed; --line:#d2d2d7;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Tajawal",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:var(--font);color:var(--text);display:flex;flex-direction:column;background:var(--gray-bg);}
  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 18px;background:var(--white);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  header h1{font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .score{font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums;}
  .stage{position:relative;flex:1;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#0b1d3a 0%,#04070f 70%);touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  .hint-bar{
    flex:0 0 auto;text-align:center;font-size:12px;color:var(--text-2);
    padding:8px;background:var(--white);border-top:1px solid var(--line);
  }
  .overlay{
    position:absolute;inset:0;display:none;place-items:center;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);text-align:center;padding:24px;
  }
  .overlay.show{display:grid;}
  .card{max-width:280px;}
  .card h2{font-size:22px;font-weight:600;margin-bottom:6px;}
  .card p{color:var(--text-2);font-size:15px;margin-bottom:4px;}
  .card .big{font-size:34px;font-weight:700;color:var(--text);margin:10px 0;}
  .btn{
    border:none;cursor:pointer;background:var(--blue);color:#fff;font-family:var(--font);
    font-size:16px;padding:10px 26px;border-radius:980px;margin-top:14px;transition:background .2s ease;
  }
  .btn:hover{background:var(--blue-hover);}
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px;}
</style>
</head>
<body>
  <header>
    <h1>🚀 مغامرة الفضاء</h1>
    <span class="score" id="scoreEl">النقاط: 0</span>
  </header>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2>اصطدمت المركبة!</h2>
        <div class="big" id="finalScore">0</div>
        <p>أفضل نتيجة: <span id="bestScore">0</span></p>
        <button class="btn" id="restartBtn" type="button">العب مرة أخرى</button>
      </div>
    </div>
  </div>
  <div class="hint-bar">حرّك المركبة بالأسهم أو بالسحب باللمس/الفأرة · تجنّب الكويكبات ☄️ واجمع النجوم ⭐</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreEl');
const overlay = document.getElementById('overlay');
const finalScore = document.getElementById('finalScore');
const bestScore = document.getElementById('bestScore');
const restartBtn = document.getElementById('restartBtn');
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

function resize(){ canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
window.addEventListener('resize', resize);

let ship = { x: 0, y: 0, r: 22 };
let asteroids = [], stars = [];
let score = 0, best = +localStorage.getItem('space-best') || 0;
let running = false, last = 0, spawnTimer = 0, starTimer = 0;

function resetGame(){
  resize();
  ship.x = canvas.width / 2;
  ship.y = canvas.height - 80;
  asteroids = []; stars = []; score = 0; spawnTimer = 0; starTimer = 0;
  running = true;
  overlay.classList.remove('show');
  last = performance.now();
  requestAnimationFrame(loop);
}

let pointerActive = false;
function setPointer(x, y){
  const rect = canvas.getBoundingClientRect();
  ship.x = Math.min(Math.max(x - rect.left, ship.r), canvas.width - ship.r);
  ship.y = Math.min(Math.max(y - rect.top, ship.r), canvas.height - ship.r);
}
canvas.addEventListener('pointerdown', e => { pointerActive = true; setPointer(e.clientX, e.clientY); });
window.addEventListener('pointermove', e => { if (pointerActive) setPointer(e.clientX, e.clientY); });
window.addEventListener('pointerup', () => pointerActive = false);

const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

function loop(now){
  if (!running) return;
  const dt = Math.min((now - last) / 1000, .05);
  last = now;

  const speed = 280;
  if (keys['ArrowLeft'])  ship.x -= speed * dt;
  if (keys['ArrowRight']) ship.x += speed * dt;
  if (keys['ArrowUp'])    ship.y -= speed * dt;
  if (keys['ArrowDown'])  ship.y += speed * dt;
  ship.x = Math.min(Math.max(ship.x, ship.r), canvas.width - ship.r);
  ship.y = Math.min(Math.max(ship.y, ship.r), canvas.height - ship.r);

  const difficulty = 1 + score / 400;
  spawnTimer += dt; starTimer += dt;
  if (spawnTimer > Math.max(.9 - difficulty * .06, .28)){
    spawnTimer = 0;
    asteroids.push({ x: Math.random() * canvas.width, y: -20, r: 16 + Math.random() * 14, s: 110 * difficulty + Math.random() * 60 });
  }
  if (starTimer > 2.4){
    starTimer = 0;
    stars.push({ x: Math.random() * canvas.width, y: -20, r: 14, s: 150 });
  }

  asteroids.forEach(a => a.y += a.s * dt);
  stars.forEach(s => s.y += s.s * dt);
  asteroids = asteroids.filter(a => a.y < canvas.height + 40);
  stars = stars.filter(s => s.y < canvas.height + 40);

  for (const a of asteroids){
    if (Math.hypot(a.x - ship.x, a.y - ship.y) < a.r + ship.r - 10) return gameOver();
  }
  for (let i = stars.length - 1; i >= 0; i--){
    const s = stars[i];
    if (Math.hypot(s.x - ship.x, s.y - ship.y) < s.r + ship.r - 6){ stars.splice(i, 1); score += 15; }
  }
  score += dt * 10;

  draw();
  requestAnimationFrame(loop);
}

function draw(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = (ship.r * 2) + 'px ' + EMOJI_FONT;
  ctx.fillText('🚀', ship.x, ship.y);
  asteroids.forEach(a => { ctx.font = (a.r * 2) + 'px ' + EMOJI_FONT; ctx.fillText('☄️', a.x, a.y); });
  stars.forEach(s => { ctx.font = (s.r * 2) + 'px ' + EMOJI_FONT; ctx.fillText('⭐', s.x, s.y); });
  scoreEl.textContent = 'النقاط: ' + Math.floor(score);
}

function gameOver(){
  running = false;
  const s = Math.floor(score);
  if (s > best){ best = s; localStorage.setItem('space-best', best); }
  finalScore.textContent = s;
  bestScore.textContent = best;
  overlay.classList.add('show');
}

restartBtn.addEventListener('click', resetGame);
resetGame();
</script>
</body>
</html>
