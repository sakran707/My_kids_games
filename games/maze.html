<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>متاهة الغابة</title>
<style>
  :root{
    --white:#fff; --gray-bg:#f5f5f7; --text:#1d1d1f; --text-2:#6e6e73;
    --blue:#0071e3; --blue-hover:#0077ed; --line:#d2d2d7; --green:#1e5b3a;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Tajawal",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:var(--font);color:var(--text);display:flex;flex-direction:column;background:var(--gray-bg);}
  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 18px;background:var(--white);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  header h1{font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .stats{display:flex;gap:14px;font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums;}
  .stage{position:relative;flex:1;overflow:hidden;background:#e7f3e9;display:grid;place-items:center;touch-action:none;}
  canvas{display:block;}
  .dpad{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px;
    opacity:.9;
  }
  .dpad button{
    border:none;border-radius:12px;background:var(--white);box-shadow:0 2px 8px rgba(0,0,0,.15);
    font-size:18px;cursor:pointer;color:var(--text);
  }
  .dpad button:active{background:var(--gray-bg);}
  .dpad .up{grid-column:2;grid-row:1;} .dpad .left{grid-column:1;grid-row:2;}
  .dpad .right{grid-column:3;grid-row:2;} .dpad .down{grid-column:2;grid-row:3;}
  .hint-bar{
    flex:0 0 auto;text-align:center;font-size:12px;color:var(--text-2);
    padding:8px;background:var(--white);border-top:1px solid var(--line);
  }
  .overlay{
    position:absolute;inset:0;display:none;place-items:center;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);text-align:center;padding:24px;
  }
  .overlay.show{display:grid;}
  .card{max-width:280px;}
  .card h2{font-size:22px;font-weight:600;margin-bottom:6px;}
  .card p{color:var(--text-2);font-size:15px;margin-bottom:4px;}
  .btn{
    border:none;cursor:pointer;background:var(--blue);color:#fff;font-family:var(--font);
    font-size:16px;padding:10px 26px;border-radius:980px;margin-top:14px;transition:background .2s ease;
  }
  .btn:hover{background:var(--blue-hover);}
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px;}
</style>
</head>
<body>
  <header>
    <h1>🌲 متاهة الغابة</h1>
    <div class="stats">
      <span id="timeEl">الوقت: 0.0 ث</span>
      <span id="bestEl">الأفضل: —</span>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="dpad" id="dpad" aria-hidden="true">
      <button class="up" type="button" data-dir="ArrowUp">▲</button>
      <button class="left" type="button" data-dir="ArrowLeft">◀</button>
      <button class="right" type="button" data-dir="ArrowRight">▶</button>
      <button class="down" type="button" data-dir="ArrowDown">▼</button>
    </div>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2>وصلت إلى الهدف! 🎉</h2>
        <p id="resultTime">الوقت: 0.0 ثانية</p>
        <button class="btn" id="restartBtn" type="button">متاهة جديدة</button>
      </div>
    </div>
  </div>
  <div class="hint-bar">تحرّك بالأسهم أو W A S D أو بأزرار الاتجاه · صل السنجاب 🐿️ إلى العلم 🏁</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const timeEl = document.getElementById('timeEl');
const bestEl = document.getElementById('bestEl');
const overlay = document.getElementById('overlay');
const resultTime = document.getElementById('resultTime');
const restartBtn = document.getElementById('restartBtn');
const dpad = document.getElementById('dpad');
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

const COLS = 9, ROWS = 11;
let cell, grid, player, goal, running = false, startTime = 0, elapsed = 0;
let best = +localStorage.getItem('maze-best') || 0;
if (best) bestEl.textContent = 'الأفضل: ' + best.toFixed(1) + ' ث';

function idx(x, y){ return y * COLS + x; }

function genMaze(){
  grid = Array.from({ length: COLS * ROWS }, () => ({ N: true, E: true, S: true, W: true, visited: false }));
  const stack = [[0, 0]];
  grid[idx(0, 0)].visited = true;
  const opp = { N: 'S', E: 'W', S: 'N', W: 'E' };
  while (stack.length){
    const [x, y] = stack[stack.length - 1];
    const options = [];
    if (y > 0 && !grid[idx(x, y - 1)].visited) options.push(['N', x, y - 1]);
    if (x < COLS - 1 && !grid[idx(x + 1, y)].visited) options.push(['E', x + 1, y]);
    if (y < ROWS - 1 && !grid[idx(x, y + 1)].visited) options.push(['S', x, y + 1]);
    if (x > 0 && !grid[idx(x - 1, y)].visited) options.push(['W', x - 1, y]);
    if (!options.length){ stack.pop(); continue; }
    const [dir, nx, ny] = options[Math.floor(Math.random() * options.length)];
    grid[idx(x, y)][dir] = false;
    grid[idx(nx, ny)][opp[dir]] = false;
    grid[idx(nx, ny)].visited = true;
    stack.push([nx, ny]);
  }
}

function sizeCanvas(){
  const maxW = stage.clientWidth - 20, maxH = stage.clientHeight - 20;
  cell = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
  canvas.width = cell * COLS;
  canvas.height = cell * ROWS;
}

function resetGame(){
  genMaze();
  sizeCanvas();
  player = { x: 0, y: 0 };
  goal = { x: COLS - 1, y: ROWS - 1 };
  running = true;
  overlay.classList.remove('show');
  startTime = performance.now();
  requestAnimationFrame(tick);
}

function move(dir){
  if (!running) return;
  const c = grid[idx(player.x, player.y)];
  if (dir === 'ArrowUp' && !c.N) player.y--;
  else if (dir === 'ArrowDown' && !c.S) player.y++;
  else if (dir === 'ArrowLeft' && !c.W) player.x--;
  else if (dir === 'ArrowRight' && !c.E) player.x++;
  if (player.x === goal.x && player.y === goal.y) win();
}

window.addEventListener('keydown', e => {
  const map = { ArrowUp:'ArrowUp', ArrowDown:'ArrowDown', ArrowLeft:'ArrowLeft', ArrowRight:'ArrowRight',
                w:'ArrowUp', s:'ArrowDown', a:'ArrowLeft', d:'ArrowRight' };
  const dir = map[e.key];
  if (dir){ e.preventDefault(); move(dir); }
});
dpad.querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => move(b.dataset.dir));
});

function tick(now){
  if (!running) return;
  elapsed = (now - startTime) / 1000;
  timeEl.textContent = 'الوقت: ' + elapsed.toFixed(1) + ' ث';
  draw();
  requestAnimationFrame(tick);
}

function draw(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#1e5b3a';
  ctx.lineWidth = Math.max(cell * .07, 2);
  ctx.lineCap = 'round';
  for (let y = 0; y < ROWS; y++){
    for (let x = 0; x < COLS; x++){
      const c = grid[idx(x, y)];
      const px = x * cell, py = y * cell;
      ctx.beginPath();
      if (c.N){ ctx.moveTo(px, py); ctx.lineTo(px + cell, py); }
      if (c.W){ ctx.moveTo(px, py); ctx.lineTo(px, py + cell); }
      if (y === ROWS - 1 && c.S){ ctx.moveTo(px, py + cell); ctx.lineTo(px + cell, py + cell); }
      if (x === COLS - 1 && c.E){ ctx.moveTo(px + cell, py); ctx.lineTo(px + cell, py + cell); }
      ctx.stroke();
    }
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = (cell * .8) + 'px ' + EMOJI_FONT;
  ctx.fillText('🏁', goal.x * cell + cell / 2, goal.y * cell + cell / 2);
  ctx.fillText('🐿️', player.x * cell + cell / 2, player.y * cell + cell / 2);
}

function win(){
  running = false;
  if (!best || elapsed < best){ best = elapsed; localStorage.setItem('maze-best', best); bestEl.textContent = 'الأفضل: ' + best.toFixed(1) + ' ث'; }
  resultTime.textContent = 'الوقت: ' + elapsed.toFixed(1) + ' ثانية';
  overlay.classList.add('show');
}

window.addEventListener('resize', () => { if (running) { sizeCanvas(); draw(); } });
restartBtn.addEventListener('click', resetGame);
resetGame();
</script>
</body>
</html>
