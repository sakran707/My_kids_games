<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>قطف التفاح</title>
<style>
  :root{
    --white:#fff; --gray-bg:#f5f5f7; --text:#1d1d1f; --text-2:#6e6e73;
    --blue:#0071e3; --blue-hover:#0077ed; --line:#d2d2d7;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Tajawal",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:var(--font);color:var(--text);display:flex;flex-direction:column;background:var(--gray-bg);}
  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 18px;background:var(--white);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  header h1{font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .stats{display:flex;gap:14px;font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums;}
  .stage{position:relative;flex:1;overflow:hidden;background:linear-gradient(180deg,#bfe3ff 0%,#eaf7ff 55%,#fef9e7 100%);touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  .hint-bar{
    flex:0 0 auto;text-align:center;font-size:12px;color:var(--text-2);
    padding:8px;background:var(--white);border-top:1px solid var(--line);
  }
  .overlay{
    position:absolute;inset:0;display:none;place-items:center;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);text-align:center;padding:24px;
  }
  .overlay.show{display:grid;}
  .card{max-width:280px;}
  .card h2{font-size:22px;font-weight:600;margin-bottom:6px;}
  .card p{color:var(--text-2);font-size:15px;margin-bottom:4px;}
  .card .big{font-size:34px;font-weight:700;color:var(--text);margin:10px 0;}
  .btn{
    border:none;cursor:pointer;background:var(--blue);color:#fff;font-family:var(--font);
    font-size:16px;padding:10px 26px;border-radius:980px;margin-top:14px;transition:background .2s ease;
  }
  .btn:hover{background:var(--blue-hover);}
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px;}
</style>
</head>
<body>
  <header>
    <h1>🍎 قطف التفاح</h1>
    <div class="stats">
      <span id="scoreEl">النقاط: 0</span>
      <span id="livesEl">❤️❤️❤️</span>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2>انتهت اللعبة!</h2>
        <div class="big" id="finalScore">0</div>
        <p>أفضل نتيجة: <span id="bestScore">0</span></p>
        <button class="btn" id="restartBtn" type="button">العب مرة أخرى</button>
      </div>
    </div>
  </div>
  <div class="hint-bar">حرّك السلّة بالأسهم أو بالسحب باللمس/الفأرة · اجمع التفاح 🍎 وتجنّب الدود 🐛</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreEl');
const livesEl = document.getElementById('livesEl');
const overlay = document.getElementById('overlay');
const finalScore = document.getElementById('finalScore');
const bestScore = document.getElementById('bestScore');
const restartBtn = document.getElementById('restartBtn');
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

function resize(){ canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
window.addEventListener('resize', resize);

let basket = { x: 0, y: 0, w: 70, h: 46 };
let items = [];
let score = 0, lives = 3, best = +localStorage.getItem('apples-best') || 0;
let running = false, last = 0, spawnTimer = 0;

function resetGame(){
  resize();
  basket.x = canvas.width / 2;
  basket.y = canvas.height - 50;
  items = []; score = 0; lives = 3; spawnTimer = 0;
  running = true;
  overlay.classList.remove('show');
  updateLives();
  last = performance.now();
  requestAnimationFrame(loop);
}

function updateLives(){ livesEl.textContent = '❤️'.repeat(Math.max(lives, 0)); }

let pointerActive = false;
function setPointer(x){
  const rect = canvas.getBoundingClientRect();
  basket.x = Math.min(Math.max(x - rect.left, basket.w / 2), canvas.width - basket.w / 2);
}
canvas.addEventListener('pointerdown', e => { pointerActive = true; setPointer(e.clientX); });
window.addEventListener('pointermove', e => { if (pointerActive) setPointer(e.clientX); });
window.addEventListener('pointerup', () => pointerActive = false);

const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

function loop(now){
  if (!running) return;
  const dt = Math.min((now - last) / 1000, .05);
  last = now;

  const speed = 320;
  if (keys['ArrowLeft'])  basket.x -= speed * dt;
  if (keys['ArrowRight']) basket.x += speed * dt;
  basket.x = Math.min(Math.max(basket.x, basket.w / 2), canvas.width - basket.w / 2);

  const difficulty = 1 + score / 250;
  spawnTimer += dt;
  if (spawnTimer > Math.max(1 - difficulty * .06, .35)){
    spawnTimer = 0;
    const bad = Math.random() < .2;
    items.push({ x: 20 + Math.random() * (canvas.width - 40), y: -20, r: 18, s: 130 * difficulty + Math.random() * 40, bad });
  }

  items.forEach(it => it.y += it.s * dt);

  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    const caught = it.y > basket.y - basket.h / 2 && it.y < basket.y + basket.h / 2 &&
                   Math.abs(it.x - basket.x) < basket.w / 2 + it.r * .5;
    if (caught){
      items.splice(i, 1);
      if (it.bad){ lives--; updateLives(); if (lives <= 0) return gameOver(); }
      else score += 10;
      continue;
    }
    if (it.y > canvas.height + 30) items.splice(i, 1);
  }

  draw();
  requestAnimationFrame(loop);
}

function draw(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '44px ' + EMOJI_FONT;
  ctx.fillText('🧺', basket.x, basket.y);
  items.forEach(it => {
    ctx.font = (it.r * 2) + 'px ' + EMOJI_FONT;
    ctx.fillText(it.bad ? '🐛' : '🍎', it.x, it.y);
  });
  scoreEl.textContent = 'النقاط: ' + score;
}

function gameOver(){
  running = false;
  if (score > best){ best = score; localStorage.setItem('apples-best', best); }
  finalScore.textContent = score;
  bestScore.textContent = best;
  overlay.classList.add('show');
}

restartBtn.addEventListener('click', resetGame);
resetGame();
</script>
</body>
</html>
