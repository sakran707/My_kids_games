<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>سباق السيارات</title>
<style>
  :root{
    --white:#fff; --gray-bg:#f5f5f7; --text:#1d1d1f; --text-2:#6e6e73;
    --blue:#0071e3; --blue-hover:#0077ed; --line:#d2d2d7;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Tajawal",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:var(--font);color:var(--text);display:flex;flex-direction:column;background:var(--gray-bg);}
  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 18px;background:var(--white);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  header h1{font-size:16px;font-weight:600;letter-spacing:-.01em;}
  .score{font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums;}
  .stage{position:relative;flex:1;overflow:hidden;background:#3a3a3f;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
  .side-controls{
    position:absolute;inset:0;display:flex;
  }
  .side-controls .zone{flex:1;}
  .hint-bar{
    flex:0 0 auto;text-align:center;font-size:12px;color:var(--text-2);
    padding:8px;background:var(--white);border-top:1px solid var(--line);
  }
  .overlay{
    position:absolute;inset:0;display:none;place-items:center;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);text-align:center;padding:24px;
  }
  .overlay.show{display:grid;}
  .card{max-width:280px;}
  .card h2{font-size:22px;font-weight:600;margin-bottom:6px;}
  .card p{color:var(--text-2);font-size:15px;margin-bottom:4px;}
  .card .big{font-size:34px;font-weight:700;color:var(--text);margin:10px 0;}
  .btn{
    border:none;cursor:pointer;background:var(--blue);color:#fff;font-family:var(--font);
    font-size:16px;padding:10px 26px;border-radius:980px;margin-top:14px;transition:background .2s ease;
  }
  .btn:hover{background:var(--blue-hover);}
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px;}
</style>
</head>
<body>
  <header>
    <h1>🏎️ سباق السيارات</h1>
    <span class="score" id="scoreEl">النقاط: 0</span>
  </header>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="side-controls" id="sideControls">
      <div class="zone" data-dir="left"></div>
      <div class="zone" data-dir="right"></div>
    </div>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2>حصل اصطدام!</h2>
        <div class="big" id="finalScore">0</div>
        <p>أفضل نتيجة: <span id="bestScore">0</span></p>
        <button class="btn" id="restartBtn" type="button">العب مرة أخرى</button>
      </div>
    </div>
  </div>
  <div class="hint-bar">بدّل المسار بالأسهم اليسار/اليمين أو بلمس جانبي الشاشة · تفادَ السيارات الأخرى</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreEl');
const overlay = document.getElementById('overlay');
const finalScore = document.getElementById('finalScore');
const bestScore = document.getElementById('bestScore');
const restartBtn = document.getElementById('restartBtn');
const sideControls = document.getElementById('sideControls');
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

function resize(){ canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
window.addEventListener('resize', resize);

const LANES = 3;
let laneX = [];
let playerLane = 1, playerDrawX = 0;
let rivals = [];
let score = 0, best = +localStorage.getItem('race-best') || 0;
let running = false, last = 0, spawnTimer = 0, roadOffset = 0;

function computeLanes(){
  const roadW = Math.min(canvas.width * .8, 340);
  const left = (canvas.width - roadW) / 2;
  laneX = [0, 1, 2].map(i => left + roadW * (i + .5) / LANES);
}

function resetGame(){
  resize();
  computeLanes();
  playerLane = 1;
  playerDrawX = laneX[1];
  rivals = []; score = 0; spawnTimer = 0; roadOffset = 0;
  running = true;
  overlay.classList.remove('show');
  last = performance.now();
  requestAnimationFrame(loop);
}

function changeLane(dir){
  if (!running) return;
  playerLane = Math.min(Math.max(playerLane + dir, 0), LANES - 1);
}
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') changeLane(-1);
  if (e.key === 'ArrowRight') changeLane(1);
});
sideControls.querySelectorAll('.zone').forEach(z => {
  z.addEventListener('pointerdown', () => changeLane(z.dataset.dir === 'left' ? -1 : 1));
});

function loop(now){
  if (!running) return;
  const dt = Math.min((now - last) / 1000, .05);
  last = now;

  computeLanes();
  const targetX = laneX[playerLane];
  playerDrawX += (targetX - playerDrawX) * Math.min(dt * 10, 1);

  const speed = 220 + score * 1.4;
  roadOffset = (roadOffset + speed * dt) % 60;

  spawnTimer += dt;
  const spawnRate = Math.max(1.1 - score / 400, .45);
  if (spawnTimer > spawnRate){
    spawnTimer = 0;
    const lane = Math.floor(Math.random() * LANES);
    rivals.push({ lane, y: -60, emoji: Math.random() < .5 ? '🚗' : '🚙' });
  }
  rivals.forEach(r => r.y += speed * dt);
  rivals = rivals.filter(r => r.y < canvas.height + 60);

  for (const r of rivals){
    const rx = laneX[r.lane];
    if (r.lane === playerLane && Math.abs(r.y - (canvas.height - 90)) < 46) return gameOver();
    void rx;
  }

  score += dt * 12;
  draw();
  requestAnimationFrame(loop);
}

function draw(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const roadW = Math.min(canvas.width * .8, 340);
  const left = (canvas.width - roadW) / 2;
  ctx.fillStyle = '#55555c';
  ctx.fillRect(left, 0, roadW, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,.6)';
  ctx.lineWidth = 3;
  ctx.setLineDash([18, 16]);
  for (let i = 1; i < LANES; i++){
    const x = left + roadW * i / LANES;
    ctx.beginPath();
    ctx.moveTo(x, roadOffset - 60);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  rivals.forEach(r => {
    ctx.font = '40px ' + EMOJI_FONT;
    ctx.save();
    ctx.translate(laneX[r.lane], r.y);
    ctx.rotate(Math.PI);
    ctx.fillText(r.emoji, 0, 0);
    ctx.restore();
  });
  ctx.font = '42px ' + EMOJI_FONT;
  ctx.fillText('🏎️', playerDrawX, canvas.height - 90);

  scoreEl.textContent = 'النقاط: ' + Math.floor(score);
}

function gameOver(){
  running = false;
  const s = Math.floor(score);
  if (s > best){ best = s; localStorage.setItem('race-best', best); }
  finalScore.textContent = s;
  bestScore.textContent = best;
  overlay.classList.add('show');
}

restartBtn.addEventListener('click', resetGame);
resetGame();
</script>
</body>
</html>
